# Generates TaDo.xcodeproj — run `xcodegen` in this folder after changing it.
name: TaDo
options:
  bundleIdPrefix: com.ethanpalani
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  TaDo:
    type: application
    platform: iOS
    sources:
      - TaDo
    dependencies:
      - package: Supabase
    info:
      path: TaDo/Info.plist
      properties:
        CFBundleDisplayName: Ta-do
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Same tint as the app background, so launch doesn't flash white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Siri hears "Ta-do" as "to do" and confuses it with Notes/Reminders; alternative
        # names (with pronunciation hints) let Siri phrases match the app unambiguously.
        INAlternativeAppNames:
          - INAlternativeAppName: Tah-doh
            INAlternativeAppNamePronunciationHint: tah doh
          - INAlternativeAppName: Tado
            INAlternativeAppNamePronunciationHint: tah doe
          - INAlternativeAppName: Ta-do app
            INAlternativeAppNamePronunciationHint: tah doh app
        NSMicrophoneUsageDescription: Ta-do listens while you capture a thought, task or goal by voice.
        NSSpeechRecognitionUsageDescription: Ta-do uses Apple's speech recognition to turn what you say into a thought, task or goal.
        # Sign-in (magic link + Google) returns to the app via tado://auth-callback;
        # tado://capture opens straight into voice capture.
        CFBundleURLTypes:
          - CFBundleURLName: com.ethanpalani.TaDo.auth
            CFBundleURLSchemes: [tado]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanpalani.TaDo
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Ethan's free Personal Team — installs on his own iPhone, expire after 7 days.
        DEVELOPMENT_TEAM: R339XDW4V8
    scheme:
      testTargets:
        - TaDoTests
  TaDoTests:
    type: bundle.unit-test
    platform: iOS
    # The parser is plain Foundation code, so it's compiled straight into the tests —
    # no app host to launch, and the suite runs in seconds.
    sources:
      - TaDoTests
      - TaDo/Voice/CommandParser.swift
      - TaDo/Data/Models.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: R339XDW4V8
        SWIFT_VERSION: "5.10"
